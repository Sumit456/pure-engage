openapi: 3.1.0
info:
  title: PureNet OAuth token endpoint (consumer-driven draft)
  version: 0.1.0-draft
  summary: Client-credentials token issuance. Every element is INFERRED (A-002).
  description: |
    **This is not PureNet's real token endpoint.** It's split out from purenet.openapi.yaml because the token
    URL sits outside the `/v1` API base. Lets the mock issue tokens so the connector's auth flow can be exercised.
    Examples are synthetic.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-evidence: { status: INFERRED, assumption: A-002 }
servers:
  - url: https://sandbox.purenet.example.invalid
    description: Sandbox (placeholder host)
security: []
tags:
  - name: OAuth
    description: Token issuance.
paths:
  /oauth2/token:
    post:
      tags: [OAuth]
      operationId: issueToken
      summary: Issue an access token (client credentials, RFC 6749 §4.4)
      x-evidence: { status: INFERRED, assumption: A-002 }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            example: { grant_type: client_credentials, client_id: test-client, client_secret: test-secret, scope: members.read consents.read }
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { access_token: mock-access-token, token_type: Bearer, expires_in: 3600, scope: members.read consents.read }
        '400':
          description: Invalid request or unsupported grant (RFC 6749 §5.2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenError' }
              example: { error: invalid_request }
        '401':
          description: Client authentication failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenError' }
              example: { error: invalid_client }
components:
  schemas:
    TokenRequest:
      type: object
      x-evidence: { status: INFERRED, assumption: A-002 }
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type: { type: string, const: client_credentials }
        client_id: { type: string }
        client_secret: { type: string }
        scope: { type: string, description: Space-separated scopes. }
    TokenResponse:
      type: object
      x-evidence: { status: INFERRED, assumption: A-002 }
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer, description: Lifetime in seconds. }
        scope: { type: string }
    TokenError:
      type: object
      x-evidence: { status: INFERRED, assumption: A-002 }
      required: [error]
      properties:
        error: { type: string, enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope] }
        error_description: { type: string }
