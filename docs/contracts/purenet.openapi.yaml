openapi: 3.1.0
info:
  title: PureNet API (consumer-driven draft)
  version: 0.1.0-draft
  summary: What Pure Engage needs from PureNet. Every element is INFERRED.
  description: |
    **This is not PureNet's real API.** It's a draft of the API this platform needs, for the PureNet team
    to correct. No PureNet documentation, traffic or code was available (see docs/audit/orbit-audit.md).
    Every operation, schema and security scheme carries `x-evidence` pointing at
    docs/contracts/ASSUMPTIONS.md. All examples are synthetic.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-evidence: { status: INFERRED, assumption: A-001 }
servers:
  - url: https://sandbox.purenet.example.invalid/v1
    description: Sandbox (placeholder host)
    x-evidence: { status: INFERRED, assumption: A-003 }
security:
  - purenetOAuth: [members.read]
tags:
  - name: Members
    description: Member identity and contact data.
  - name: Consents
    description: Communication consent.
  - name: Subscriptions
    description: Event push registration.
paths:
  /members:
    get:
      tags: [Members]
      operationId: searchMembers
      summary: Find members by identifier
      x-evidence: { status: INFERRED, assumption: A-005 }
      parameters:
        - name: identifier
          in: query
          required: true
          description: '`system|value`, for example `urn:purenet:member-id|MBR-TEST-0001`.'
          schema: { type: string, pattern: '^[^|]+\|[^|]+$' }
          example: urn:purenet:member-id|MBR-TEST-0001
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matching members (may be empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
              examples:
                found: { $ref: '#/components/examples/MemberPageFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /members/{memberId}:
    get:
      tags: [Members]
      operationId: getMember
      summary: Get a member
      x-evidence: { status: INFERRED, assumption: A-006 }
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
              examples:
                member: { $ref: '#/components/examples/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /members/{memberId}/consents:
    get:
      tags: [Consents]
      operationId: listMemberConsents
      summary: List a member's communication consents
      x-evidence: { status: INFERRED, assumption: A-007 }
      security:
        - purenetOAuth: [consents.read]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Consents, one per channel and purpose.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Consent' }
              examples:
                consents: { $ref: '#/components/examples/Consents' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /subscriptions:
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      summary: Register an HTTPS callback for events
      x-evidence: { status: INFERRED, assumption: A-008 }
      security:
        - purenetOAuth: [subscriptions.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionRequest' }
            examples:
              appointments: { $ref: '#/components/examples/SubscriptionRequest' }
      responses:
        '201':
          description: Subscription created. The signing secret is returned once only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionCreated' }
              examples:
                created: { $ref: '#/components/examples/SubscriptionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /subscriptions/{subscriptionId}:
    delete:
      tags: [Subscriptions]
      operationId: deleteSubscription
      summary: Remove a subscription
      x-evidence: { status: INFERRED, assumption: A-008 }
      security:
        - purenetOAuth: [subscriptions.write]
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string }
          example: sub_test_0001
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    purenetOAuth:
      type: oauth2
      description: OAuth 2.0 client credentials. Token URL and scopes are placeholders.
      x-evidence: { status: INFERRED, assumption: A-002 }
      flows:
        clientCredentials:
          tokenUrl: https://sandbox.purenet.example.invalid/oauth2/token
          scopes:
            members.read: Read member identity and contact points
            consents.read: Read communication consents
            subscriptions.write: Manage event subscriptions
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
      example: MBR-TEST-0001
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`.
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Bad Request, status: 400, detail: identifier must be system|value }
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Unauthorized, status: 401 }
    NotFound:
      description: Not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Not Found, status: 404 }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Too Many Requests, status: 429 }
  schemas:
    Identifier:
      type: object
      x-evidence: { status: INFERRED, assumption: A-004 }
      required: [system, value]
      properties:
        system: { type: string, description: Namespace URI of the identifier. }
        value: { type: string }
    ContactPoint:
      type: object
      x-evidence: { status: INFERRED, assumption: A-006 }
      required: [channel, value]
      properties:
        channel: { type: string, enum: [email, sms, push] }
        value: { type: string }
        verified: { type: boolean }
    Member:
      type: object
      x-evidence: { status: INFERRED, assumption: A-006 }
      required: [memberId, identifiers, updatedAt]
      properties:
        memberId: { type: string }
        identifiers:
          type: array
          items: { $ref: '#/components/schemas/Identifier' }
        givenName: { type: string }
        familyName: { type: string }
        preferredLanguage: { type: string, description: BCP 47 tag, examples: [ar, en] }
        contactPoints:
          type: array
          items: { $ref: '#/components/schemas/ContactPoint' }
        updatedAt: { type: string, format: date-time }
    MemberPage:
      type: object
      x-evidence: { status: INFERRED, assumption: A-013 }
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        next_cursor: { type: [string, 'null'] }
    Consent:
      type: object
      x-evidence: { status: INFERRED, assumption: A-007 }
      required: [channel, purpose, status, updatedAt]
      properties:
        channel: { type: string, enum: [email, sms, push] }
        purpose: { type: string, enum: [care, marketing] }
        status: { type: string, enum: [granted, denied, unknown] }
        updatedAt: { type: string, format: date-time }
    SubscriptionRequest:
      type: object
      x-evidence: { status: INFERRED, assumption: A-008 }
      required: [callbackUrl, eventTypes]
      properties:
        callbackUrl: { type: string, format: uri, pattern: '^https://' }
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [member.updated, consent.changed, appointment.booked, appointment.cancelled, appointment.reminder_due]
    SubscriptionCreated:
      type: object
      x-evidence: { status: INFERRED, assumption: A-011 }
      required: [id, callbackUrl, eventTypes, signingSecret]
      properties:
        id: { type: string }
        callbackUrl: { type: string, format: uri }
        eventTypes:
          type: array
          items: { type: string }
        signingSecret: { type: string, description: HMAC secret for X-PureNet-Signature. Shown once. }
    Problem:
      type: object
      x-evidence: { status: INFERRED, assumption: A-012 }
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
  examples:
    Member:
      summary: Synthetic member
      value:
        memberId: MBR-TEST-0001
        identifiers:
          - { system: 'urn:purenet:member-id', value: MBR-TEST-0001 }
        givenName: Test
        familyName: Member
        preferredLanguage: ar
        contactPoints:
          - { channel: email, value: test.member@example.com, verified: true }
          - { channel: sms, value: '+971500000001', verified: true }
        updatedAt: '2026-01-01T08:00:00Z'
    MemberPageFound:
      summary: One synthetic match
      value:
        data:
          - memberId: MBR-TEST-0001
            identifiers:
              - { system: 'urn:purenet:member-id', value: MBR-TEST-0001 }
            givenName: Test
            familyName: Member
            preferredLanguage: ar
            contactPoints:
              - { channel: email, value: test.member@example.com, verified: true }
            updatedAt: '2026-01-01T08:00:00Z'
        next_cursor: null
    Consents:
      summary: Synthetic consents
      value:
        data:
          - { channel: email, purpose: care, status: granted, updatedAt: '2026-01-01T08:00:00Z' }
          - { channel: sms, purpose: care, status: granted, updatedAt: '2026-01-01T08:00:00Z' }
          - { channel: email, purpose: marketing, status: denied, updatedAt: '2026-01-01T08:00:00Z' }
    SubscriptionRequest:
      summary: Appointment events
      value:
        callbackUrl: https://platform.example.com/hooks/purenet
        eventTypes: [appointment.booked, appointment.cancelled, appointment.reminder_due]
    SubscriptionCreated:
      summary: Created (synthetic secret)
      value:
        id: sub_test_0001
        callbackUrl: https://platform.example.com/hooks/purenet
        eventTypes: [appointment.booked, appointment.cancelled, appointment.reminder_due]
        signingSecret: whsec_TEST_NOT_A_REAL_SECRET
