# PureNet mock generated from the contract (ADR-0002). Everything it serves is INFERRED.
services:
  purenet-mock:
    image: stoplight/prism:5.16.0
    command: mock -h 0.0.0.0 -p 4010 /contracts/purenet.openapi.yaml
    ports:
      - "127.0.0.1:4010:4010"
    volumes:
      - ../../docs/contracts:/contracts:ro
