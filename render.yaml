# Render Blueprint for a Pure Engage TEST deployment: synthetic demo data, sandbox delivery, free plan.
# Not for real member data: PureHealth data must stay in UAE hosting (docs/contracts/ASSUMPTIONS.md A-018).
# Create it in Render: New > Blueprint > this repo. Render asks for the admin email and password (never committed).
databases:
  - name: pure-engage-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: pure_engage
    user: pure_engage

services:
  - type: web
    name: pure-engage
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PE_DATABASE_URL
        fromDatabase:
          name: pure-engage-db
          property: connectionString
      # Render generates a random base64 256-bit value: the 32-byte key PE_SECRET_KEY needs.
      - key: PE_TRACKING_SECRET
        generateValue: true
      - key: PE_SECRET_KEY
        generateValue: true
      - key: PE_ADMIN_EMAIL
        sync: false
      - key: PE_ADMIN_PASSWORD
        sync: false
      # Sandbox: nothing reaches a real inbox or phone; messages appear in the console's Outbox.
      - key: PE_DELIVERY_MODE
        value: sandbox
      - key: PE_SEED_DEMO
        value: "true"
      - key: PE_DEFAULT_TIMEZONE
        value: Asia/Dubai
      # PE_PUBLIC_URL defaults to Render's RENDER_EXTERNAL_URL.
